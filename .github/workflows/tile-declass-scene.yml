name: Tile a declassified scene (full resolution)

# Downloads the original USGS film scan for one declassified scene,
# georeferences it to the scene's corner coordinates, cuts XYZ map tiles,
# and commits them under public/tiles/<entityId>/ so the app serves sharp
# imagery instead of the low-res browse preview.
#
# Requires the same USGS_M2M_USERNAME / USGS_M2M_TOKEN secrets as the
# catalog harvest. Georeferencing uses the archive's corner coordinates,
# so expect an offset of a few hundred meters (film is not orthorectified);
# hand-refined control points can improve a scene later.

on:
  workflow_dispatch:
    inputs:
      entity_id:
        description: 'Candidate scene entity ids, comma-separated (first digitized one wins)'
        required: true
        default: 'DZB00402700090H020001'
      dataset:
        description: 'M2M dataset (declassi | declassii | declassiii, or as harvested e.g. corona2)'
        required: true
        default: 'declassii'
      max_zoom:
        description: 'Maximum tile zoom (15 ≈ 5 m/px, 16 doubles size)'
        required: false
        default: '15'

permissions:
  contents: write

jobs:
  tile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GDAL
        run: sudo apt-get update -q && sudo apt-get install -y -q gdal-bin python3-gdal unzip

      - name: Download product from USGS
        id: download
        env:
          USGS_M2M_USERNAME: ${{ secrets.USGS_M2M_USERNAME }}
          USGS_M2M_TOKEN: ${{ secrets.USGS_M2M_TOKEN }}
        run: |
          OUT=$(node scripts/download-declass.mjs "${{ inputs.entity_id }}" "${{ inputs.dataset }}" /tmp/dl)
          echo "$OUT"
          echo "file=$(echo "$OUT" | tail -1)" >> "$GITHUB_OUTPUT"
          echo "entity=$(echo "$OUT" | grep '^CHOSEN:' | tail -1 | cut -d: -f2)" >> "$GITHUB_OUTPUT"
          ls -lh /tmp/dl

      - name: Extract archive if needed
        id: extract
        run: |
          FILE="${{ steps.download.outputs.file }}"
          mkdir -p /tmp/extracted
          case "$FILE" in
            *.zip) unzip -o "$FILE" -d /tmp/extracted ;;
            *.tar.gz|*.tgz) tar -xzf "$FILE" -C /tmp/extracted ;;
            *.tar) tar -xf "$FILE" -C /tmp/extracted ;;
            *) cp "$FILE" /tmp/extracted/ ;;
          esac
          TIF=$(find /tmp/extracted -type f \( -iname '*.tif' -o -iname '*.tiff' -o -iname '*.ntf' \) -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$TIF" ]; then echo "No raster found"; find /tmp/extracted -type f | head; exit 1; fi
          echo "tif=$TIF" >> "$GITHUB_OUTPUT"
          gdalinfo "$TIF" | head -20

      - name: Georeference and tile
        env:
          USGS_M2M_USERNAME: ${{ secrets.USGS_M2M_USERNAME }}
          USGS_M2M_TOKEN: ${{ secrets.USGS_M2M_TOKEN }}
        run: |
          set -e
          TIF="${{ steps.extract.outputs.tif }}"
          SIZE=$(gdalinfo "$TIF" | grep 'Size is' | sed 's/Size is //;s/,//')
          W=$(echo "$SIZE" | cut -d' ' -f1)
          H=$(echo "$SIZE" | cut -d' ' -f2)
          GCPS=$(node scripts/print-gcps.mjs "${{ steps.download.outputs.entity }}" "${{ inputs.dataset }}" "$W" "$H" | tail -1)
          echo "GCPs: $GCPS"
          gdal_translate -of GTiff -a_srs EPSG:4326 $GCPS "$TIF" /tmp/gcp.tif
          gdalwarp -t_srs EPSG:3857 -r bilinear -order 1 -dstalpha \
            -co COMPRESS=JPEG -co TILED=YES /tmp/gcp.tif /tmp/warped.tif
          gdal2tiles.py --xyz -z "8-${{ inputs.max_zoom }}" -w none --processes=4 /tmp/warped.tif /tmp/tiles
          rm -rf "public/tiles/${{ steps.download.outputs.entity }}"
          mkdir -p public/tiles
          mv /tmp/tiles "public/tiles/${{ steps.download.outputs.entity }}"
          node scripts/update-tiles-manifest.mjs "${{ steps.download.outputs.entity }}" 8 "${{ inputs.max_zoom }}"
          du -sh "public/tiles/${{ steps.download.outputs.entity }}"

      - name: Commit tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tiles
          git commit -m "data: full-resolution tiles for ${{ steps.download.outputs.entity }}"
          git push

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15  # let the pushed commit become the branch tip before dispatching
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
