<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Scene Alignment Tool — Historical Syria Explorer</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #e5e7eb; font-family: system-ui, sans-serif; touch-action: manipulation; }
      button, select, input { touch-action: manipulation; }
      #panel.collapsed > *:not(.paneltop) { display: none; }
      #map { position: absolute; inset: 0; }
      #panel {
        position: absolute; top: 8px; left: 8px; right: 8px; z-index: 10;
        background: rgba(11, 15, 20, 0.94); border: 1px solid #1f2937; border-radius: 10px;
        padding: 10px 12px; max-width: 430px; font-size: 13px; line-height: 1.4;
      }
      select, button { font-size: 13px; }
      select { width: 100%; background: #111827; color: #e5e7eb; border: 1px solid #374151; border-radius: 6px; padding: 6px; margin: 6px 0; }
      button { background: #2563eb; color: white; border: 0; border-radius: 6px; padding: 7px 10px; margin: 4px 4px 0 0; cursor: pointer; }
      button.secondary { background: #374151; }
      button.active { background: #f59e0b; color: #111827; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
      .row label { width: 62px; color: #9ca3af; }
      .row input[type=range] { flex: 1; }
      .row input[type=number] {
        width: 76px; text-align: right; font-variant-numeric: tabular-nums;
        background: #111827; color: #e5e7eb; border: 1px solid #374151;
        border-radius: 6px; padding: 4px 6px; font-size: 13px;
      }
      #status { margin-top: 6px; color: #fbbf24; min-height: 16px; font-size: 12px; }
      textarea { width: 100%; height: 64px; background: #111827; color: #a7f3d0; border: 1px solid #374151; border-radius: 6px; font-family: monospace; font-size: 11px; margin-top: 6px; }
      .hint { color: #9ca3af; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <!-- Compare mode: a clean current-day map clipped to the right of the
         divider; pointer-events pass through to the main map beneath. -->
    <div id="cmpwrap" style="position:absolute; top:0; bottom:0; right:0; left:50%; overflow:hidden; pointer-events:none; display:none; z-index:5;">
      <div id="cmpmap" style="position:absolute; top:0; bottom:0; right:0; width:100vw;"></div>
    </div>
    <div id="cmphandle" style="position:absolute; top:0; bottom:0; left:50%; width:26px; margin-left:-13px; display:none; z-index:6; cursor:ew-resize; touch-action:none;">
      <div style="position:absolute; top:0; bottom:0; left:12px; width:2px; background:#38bdf8;"></div>
      <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#0b0f14; border:1px solid #38bdf8; color:#38bdf8; border-radius:9999px; padding:4px 6px; font-size:12px;">⇔</div>
    </div>
    <div id="panel">
      <div class="paneltop" style="display:flex; justify-content:space-between; align-items:center;">
        <b>Scene alignment — move / rotate / scale by eye</b>
        <button id="fold" class="secondary" style="padding:2px 10px; margin:0;">▾</button>
      </div>
      <div class="hint">
        Pick a scene, press <b>Move</b> and drag the old image until landmarks match today's
        imagery. Fine-tune with the rotate and scale sliders. Then copy the code and send it in the chat.
      </div>
      <select id="scene"></select>
      <div class="row">
        <button id="move" class="secondary">✋ Move</button>
        <button id="sharpen" class="secondary">🔍 Sharpen here</button>
        <button id="mirror" class="secondary">⇋ Mirror</button>
        <button id="compare" class="secondary">◧ Compare</button>
        <button id="reset" class="secondary">Reset</button>
        <button id="copy">Copy alignment code</button>
      </div>
      <div class="row"><label>Opacity</label><input id="opacity" type="range" min="0" max="100" value="65" /><input id="opv" type="number" min="0" max="100" step="1" value="65" /></div>
      <div class="row"><label>Rotate °</label><input id="rot" type="range" min="-1800" max="1800" value="0" /><input id="rotv" type="number" min="-180" max="180" step="0.1" value="0" /></div>
      <div class="row"><label>Scale %</label><input id="scl" type="range" min="500" max="1500" value="1000" /><input id="sclv" type="number" min="50" max="150" step="0.1" value="100" /></div>
      <div class="row"><button id="apply">⚙ Apply permanently (admin)</button></div>
      <div id="status">Loading scenes…</div>
      <textarea id="out" readonly></textarea>
    </div>
    <script>
      const TILES_BASE = 'https://pub-f8ac6c500eea43b28591b7b636fc9e3d.r2.dev';
      const $ = (id) => document.getElementById(id);
      const state = {
        manifest: {}, sceneId: null, entry: null,
        baseQuad: null,        // canvas image corners before user transform [tl,tr,br,bl] as [lon,lat]
        boundsQuad: null,      // scene bounds corners before transform (for the output code)
        center: null,          // rotation/scale pivot [lon,lat]
        dx: 0, dy: 0, theta: 0, scale: 1,
        moveMode: false, dragging: false, dragStart: null, dragBase: null,
      };

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            esri: { type: 'raster', tileSize: 256,
              tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
              attribution: 'Esri, Maxar, Earthstar Geographics' },
          },
          layers: [{ id: 'esri', type: 'raster', source: 'esri' }],
        },
        center: [36.7578, 35.1318], zoom: 12,
      });
      // Phones: accidental two-finger rotation/pitch makes alignment feel
      // random — lock the map north-up so pinch only zooms.
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();
      if (map.touchPitch) map.touchPitch.disable();

      $('fold').onclick = () => {
        const panel = $('panel');
        panel.classList.toggle('collapsed');
        $('fold').textContent = panel.classList.contains('collapsed') ? '▸' : '▾';
      };

      // ---- tile math ----
      const lon2x = (lon, z) => ((lon + 180) / 360) * 2 ** z;
      const lat2y = (lat, z) => ((1 - Math.log(Math.tan((lat * Math.PI) / 180) + 1 / Math.cos((lat * Math.PI) / 180)) / Math.PI) / 2) * 2 ** z;
      const x2lon = (x, z) => (x / 2 ** z) * 360 - 180;
      const y2lat = (y, z) => (Math.atan(Math.sinh(Math.PI * (1 - (2 * y) / 2 ** z))) * 180) / Math.PI;

      function tileUrl(id, entry, z, x, y) {
        const base = entry.storage === 'r2'
          ? TILES_BASE + '/tiles/' + id
          : location.origin + location.pathname.replace(/align\.html$/, '') + 'tiles/' + id;
        return `${base}/${z}/${x}/${y}.png`;
      }

      /** Stitch the scene's tiles over [w,s,e,n] into one canvas (≤ maxPx wide). */
      async function buildSnapshot(id, entry, bounds, maxPx = 2048) {
        const [w, s, e, n] = bounds;
        let z = entry.maxZoom;
        while (z > entry.minZoom && (lon2x(e, z) - lon2x(w, z)) * 256 > maxPx) z--;
        const x0 = Math.floor(lon2x(w, z)), x1 = Math.floor(lon2x(e, z));
        const y0 = Math.floor(lat2y(n, z)), y1 = Math.floor(lat2y(s, z));
        const canvas = document.createElement('canvas');
        canvas.width = (x1 - x0 + 1) * 256; canvas.height = (y1 - y0 + 1) * 256;
        const ctx = canvas.getContext('2d');
        const jobs = [];
        for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
          jobs.push(new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => { ctx.drawImage(img, (x - x0) * 256, (y - y0) * 256); resolve(); };
            img.onerror = () => resolve();
            img.src = tileUrl(id, entry, z, x, y);
          }));
        }
        await Promise.all(jobs);
        const quad = [
          [x2lon(x0, z), y2lat(y0, z)], [x2lon(x1 + 1, z), y2lat(y0, z)],
          [x2lon(x1 + 1, z), y2lat(y1 + 1, z)], [x2lon(x0, z), y2lat(y1 + 1, z)],
        ];
        return { url: canvas.toDataURL('image/png'), quad };
      }

      // ---- geometry: similarity transform about the pivot, in local meters ----
      function transformed(quad) {
        const [cx, cy] = state.center;
        const kLat = 111320, kLon = kLat * Math.cos((cy * Math.PI) / 180);
        const cos = Math.cos(state.theta), sin = Math.sin(state.theta);
        return quad.map(([lon, lat]) => {
          const x = (lon - cx) * kLon, y = (lat - cy) * kLat;
          const xr = state.scale * (x * cos - y * sin), yr = state.scale * (x * sin + y * cos);
          return [cx + xr / kLon + state.dx, cy + yr / kLat + state.dy];
        });
      }

      /** Map a displayed (transformed) point back to the untransformed frame. */
      function inverse([lon, lat]) {
        const [cx, cy] = state.center;
        const kLat = 111320, kLon = kLat * Math.cos((cy * Math.PI) / 180);
        const x = (lon - state.dx - cx) * kLon, y = (lat - state.dy - cy) * kLat;
        const cos = Math.cos(-state.theta), sin = Math.sin(-state.theta);
        const xr = (x * cos - y * sin) / state.scale, yr = (x * sin + y * cos) / state.scale;
        return [cx + xr / kLon, cy + yr / kLat];
      }

      /** Reflect a base-frame point across the frame's vertical centerline. */
      function mirrorBase([lon, lat]) {
        const west = state.baseQuad[0][0], east = state.baseQuad[1][0];
        return [west + east - lon, lat];
      }
      /** Frame-space mirror (before the similarity transform) when enabled. */
      const inFrame = (quad) => (state.mirror ? quad.map(mirrorBase) : quad);

      function refresh() {
        if (!state.baseQuad) return;
        map.getSource('old')?.setCoordinates(transformed(inFrame(state.baseQuad)));
        if (state.patchQuad)
          map.getSource('patch')?.setCoordinates(transformed(inFrame(state.patchQuad)));
        const q = transformed(state.boundsQuad).map((c) => c.map((v) => Number(v.toFixed(6))));
        $('out').value = JSON.stringify({
          scene: state.sceneId,
          move: { dLon: +state.dx.toFixed(6), dLat: +state.dy.toFixed(6) },
          rotateDeg: +((state.theta * 180) / Math.PI).toFixed(3),
          scale: +state.scale.toFixed(4),
          mirrored: !!state.mirror,
          center: state.center.map((v) => +v.toFixed(6)),
          boundsQuad: { nw: q[0], ne: q[1], se: q[2], sw: q[3] },
        });
      }

      async function selectScene(id) {
        state.sceneId = id; state.entry = state.manifest[id];
        state.dx = state.dy = state.theta = 0; state.scale = 1; state.patchQuad = null;
        state.mirror = false; $('mirror').classList.remove('active');
        $('rot').value = 0; $('scl').value = 1000; $('rotv').value = '0.0'; $('sclv').value = '100.0';
        $('status').textContent = 'Building scene snapshot…';
        const [w, s, e, n] = state.entry.bounds;
        state.center = [(w + e) / 2, (s + n) / 2];
        state.boundsQuad = [[w, n], [e, n], [e, s], [w, s]];
        map.fitBounds([[w, s], [e, n]], { padding: 40, duration: 0 });
        const snap = await buildSnapshot(id, state.entry, state.entry.bounds);
        state.baseQuad = snap.quad;
        for (const layer of ['old', 'patch']) {
          if (map.getLayer(layer)) map.removeLayer(layer);
          if (map.getSource(layer)) map.removeSource(layer);
        }
        map.addSource('old', { type: 'image', url: snap.url, coordinates: snap.quad });
        map.addLayer({ id: 'old', type: 'raster', source: 'old',
          paint: { 'raster-opacity': Number($('opacity').value) / 100, 'raster-fade-duration': 0 } });
        $('status').textContent = 'Drag with Move; zoom in and press 🔍 for full detail.';
        refresh();
      }

      /** Re-fetch full-detail tiles for the current view (keeps the transform). */
      async function sharpenHere() {
        if (!state.entry) return;
        $('status').textContent = 'Fetching full-detail tiles for this view…';
        const view = map.getBounds();
        // Map the viewport back into the untransformed frame (undoing the
        // mirror too — mirrored content comes from the opposite frame side)
        // and clamp to it.
        const back = (p) => (state.mirror ? mirrorBase(inverse(p)) : inverse(p));
        const pts = [
          back([view.getWest(), view.getNorth()]), back([view.getEast(), view.getNorth()]),
          back([view.getEast(), view.getSouth()]), back([view.getWest(), view.getSouth()]),
        ];
        const [bw, bs, be, bn] = state.entry.bounds;
        const w = Math.max(bw, Math.min(...pts.map((p) => p[0])));
        const e = Math.min(be, Math.max(...pts.map((p) => p[0])));
        const s = Math.max(bs, Math.min(...pts.map((p) => p[1])));
        const n = Math.min(bn, Math.max(...pts.map((p) => p[1])));
        if (!(w < e && s < n)) { $('status').textContent = 'The scene is not in view.'; return; }
        const snap = await buildSnapshot(state.sceneId, state.entry, [w, s, e, n], 2048);
        state.patchQuad = snap.quad;
        if (map.getLayer('patch')) map.removeLayer('patch');
        if (map.getSource('patch')) map.removeSource('patch');
        map.addSource('patch', { type: 'image', url: snap.url, coordinates: transformed(inFrame(snap.quad)) });
        map.addLayer({ id: 'patch', type: 'raster', source: 'patch',
          paint: { 'raster-opacity': Number($('opacity').value) / 100, 'raster-fade-duration': 0 } });
        $('status').textContent = 'Sharp view loaded — align, then 🔍 again after big moves.';
        refresh();
      }

      // ---- interactions ----
      $('move').onclick = () => {
        state.moveMode = !state.moveMode;
        $('move').classList.toggle('active', state.moveMode);
        map.dragPan[state.moveMode ? 'disable' : 'enable']();
        $('status').textContent = state.moveMode
          ? 'Move mode ON — drag the old image. Press ✋ again to pan the map.'
          : 'Move mode off — dragging pans the map.';
      };
      map.on('mousedown', (e) => { if (state.moveMode) { state.dragging = true; state.dragStart = e.lngLat; state.dragBase = [state.dx, state.dy]; } });
      map.on('touchstart', (e) => { if (state.moveMode && e.lngLat) { state.dragging = true; state.dragStart = e.lngLat; state.dragBase = [state.dx, state.dy]; } });
      const dragMove = (e) => {
        if (!state.dragging || !e.lngLat) return;
        state.dx = state.dragBase[0] + (e.lngLat.lng - state.dragStart.lng);
        state.dy = state.dragBase[1] + (e.lngLat.lat - state.dragStart.lat);
        refresh();
      };
      map.on('mousemove', dragMove); map.on('touchmove', dragMove);
      const dragEnd = () => { state.dragging = false; };
      map.on('mouseup', dragEnd); map.on('touchend', dragEnd);

      // Rotate / scale / opacity: slider and number box drive the same value.
      const setRotate = (deg) => {
        deg = Math.max(-180, Math.min(180, deg || 0));
        state.theta = deg * (Math.PI / 180);
        $('rot').value = Math.round(deg * 10);
        $('rotv').value = deg.toFixed(1);
        refresh();
      };
      const setScale = (pct) => {
        pct = Math.max(50, Math.min(150, pct || 100));
        state.scale = pct / 100;
        $('scl').value = Math.round(pct * 10);
        $('sclv').value = pct.toFixed(1);
        refresh();
      };
      const setOpacity = (pct) => {
        pct = Math.max(0, Math.min(100, pct || 0));
        $('opacity').value = pct;
        $('opv').value = pct;
        for (const layer of ['old', 'patch'])
          if (map.getLayer(layer)) map.setPaintProperty(layer, 'raster-opacity', pct / 100);
      };
      $('rot').oninput = (e) => setRotate(Number(e.target.value) / 10);
      $('rotv').onchange = (e) => setRotate(Number(e.target.value));
      $('scl').oninput = (e) => setScale(Number(e.target.value) / 10);
      $('sclv').onchange = (e) => setScale(Number(e.target.value));
      $('opacity').oninput = (e) => setOpacity(Number(e.target.value));
      $('opv').onchange = (e) => setOpacity(Number(e.target.value));
      // ---- compare divider: right of the line shows today's imagery only ----
      let cmpMap = null;
      let cmpOn = false;
      function syncCmp() {
        if (!cmpMap) return;
        cmpMap.jumpTo({
          center: map.getCenter(), zoom: map.getZoom(),
          bearing: map.getBearing(), pitch: map.getPitch(),
        });
      }
      function setDivider(fraction) {
        fraction = Math.max(0.08, Math.min(0.92, fraction));
        $('cmpwrap').style.left = fraction * 100 + '%';
        $('cmphandle').style.left = fraction * 100 + '%';
      }
      $('compare').onclick = () => {
        cmpOn = !cmpOn;
        $('compare').classList.toggle('active', cmpOn);
        $('cmpwrap').style.display = cmpOn ? 'block' : 'none';
        $('cmphandle').style.display = cmpOn ? 'block' : 'none';
        if (cmpOn && !cmpMap) {
          cmpMap = new maplibregl.Map({
            container: 'cmpmap', interactive: false, attributionControl: false,
            style: {
              version: 8,
              sources: { esri2: { type: 'raster', tileSize: 256,
                tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] } },
              layers: [{ id: 'esri2', type: 'raster', source: 'esri2' }],
            },
            center: map.getCenter(), zoom: map.getZoom(),
          });
          map.on('move', syncCmp);
        }
        if (cmpOn) { setDivider(0.5); cmpMap.resize(); syncCmp(); }
      };
      $('cmphandle').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        $('cmphandle').setPointerCapture(e.pointerId);
        const onMove = (ev) => setDivider(ev.clientX / window.innerWidth);
        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          if (cmpMap) cmpMap.resize();
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      $('sharpen').onclick = sharpenHere;
      $('mirror').onclick = () => {
        state.mirror = !state.mirror;
        $('mirror').classList.toggle('active', state.mirror);
        refresh();
      };
      $('reset').onclick = () => selectScene(state.sceneId);
      $('copy').onclick = async () => {
        await navigator.clipboard.writeText($('out').value).catch(() => $('out').select());
        $('status').textContent = 'Copied! Paste the code in the chat.';
      };

      // ---- admin: apply the current adjustment via the processing pipeline ----
      // The token is password-equivalent: keep it in sessionStorage only
      // (gone when the tab closes), never in localStorage where any future
      // script defect could read it back forever. Also purge any token a
      // previous version of this page persisted.
      const REPO = 'Triavision-ai/historical-syria-explorer';
      localStorage.removeItem('ghToken');
      const ghToken = {
        get: () => sessionStorage.getItem('ghToken') || '',
        set: (t) => sessionStorage.setItem('ghToken', t),
        clear: () => sessionStorage.removeItem('ghToken'),
      };
      $('apply').onclick = async () => {
        if (!state.sceneId) return;
        if (!confirm('Re-cut this scene with the current adjustment?\nProcessing takes 1–2 hours; the site updates automatically when done.')) return;
        let token = ghToken.get();
        if (!token) {
          token = (prompt('GitHub access token with Actions write permission on the repository (kept only until this tab closes):') || '').trim();
          if (!token) return;
          ghToken.set(token);
        }
        $('status').textContent = 'Submitting to the pipeline…';
        try {
          const registry = await fetch('tiles/corners.json?t=' + new Date().getTime())
            .then((r) => (r.ok ? r.json() : {}));
          const entry = registry[state.sceneId];
          if (!entry?.corners) {
            $('status').textContent = 'No calibration record for this scene yet — send the code in the chat instead.';
            return;
          }
          // The registry maps mosaic pixel corners → geography; apply the
          // same on-screen adjustment (mirror in frame space, then the
          // similarity transform) to those anchor points.
          const newCorners = {};
          for (const [key, lonLat] of Object.entries(entry.corners)) {
            const base = state.mirror ? mirrorBase(lonLat) : lonLat;
            newCorners[key] = transformed([base])[0].map((v) => Number(v.toFixed(6)));
          }
          let dataset = 'declassii';
          try {
            const catalog = await fetch('catalog/declass-syria.json').then((r) => r.json());
            dataset = catalog.scenes.find((s) => s.entityId === state.sceneId)?.dataset ?? dataset;
          } catch { /* seed default */ }
          const res = await fetch(
            `https://api.github.com/repos/${REPO}/actions/workflows/tile-declass-scene.yml/dispatches`,
            {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + ghToken.get(),
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                ref: 'main',
                inputs: {
                  entity_id: state.sceneId,
                  dataset,
                  max_zoom: '18',
                  corner_order: (entry.order ?? []).join(','),
                  corners_json: JSON.stringify(newCorners),
                  clean_r2: 'true',
                },
              }),
            },
          );
          if (res.status === 204) {
            $('status').textContent = '✓ Accepted — re-cutting now. The site updates itself in 1–2 hours.';
          } else {
            if (res.status === 401 || res.status === 403) ghToken.clear();
            $('status').textContent = `Pipeline rejected the request (${res.status}) — check the token and try again.`;
          }
        } catch (error) {
          $('status').textContent = 'Could not reach the pipeline: ' + error.message;
        }
      };
      $('scene').onchange = (e) => selectScene(e.target.value);

      map.on('load', async () => {
        const res = await fetch('tiles/index.json');
        state.manifest = res.ok ? await res.json() : {};
        const sel = $('scene');
        for (const id of Object.keys(state.manifest)) {
          const opt = document.createElement('option');
          opt.value = id; opt.textContent = id;
          sel.appendChild(opt);
        }
        if (sel.options.length) selectScene(sel.value);
        else $('status').textContent = 'No tiled scenes in the manifest yet.';
      });
    </script>
  </body>
</html>
